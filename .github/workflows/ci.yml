name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

jobs:
  macos:
    name: macOS 앱 · CLI 빌드
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swiftc 로 빌드 (설치 없이)
        run: |
          export SDKROOT="$(xcrun --show-sdk-path)"
          zsh scripts/build-app.sh --no-install
      - name: 번들 확인
        run: |
          ls -la "build/Leobog Control.app/Contents/MacOS"
          codesign --verify --verbose=2 "build/Leobog Control.app"

  windows:
    name: Windows 앱 빌드
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'
      - name: dotnet build
        run: dotnet build windows/LeobogControl.Windows/LeobogControl.Windows.csproj -c Release -r win-x64 --self-contained false
